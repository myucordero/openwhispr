[project]
name = "openwhispr-whisperx-sidecar"
version = "0.1.0"
description = "OpenWhispr WhisperX Python sidecar: JSONL worker for reliable transcription and diarization."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
dependencies = [
    "whisperx==3.8.6",
    "pydantic>=2",
    # Declared directly (not just via whisperx) so tool.uv.sources below can
    # steer Windows to the CUDA index — PyPI's win32 torch wheels are
    # CPU-only, while Linux PyPI wheels already bundle CUDA.
    "torch>=2.5",
    "torchaudio>=2.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[project.scripts]
openwhispr-whisperx-worker = "openwhispr_whisperx.worker:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openwhispr_whisperx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'win32'" }]
torchaudio = [{ index = "pytorch-cu128", marker = "sys_platform == 'win32'" }]
