[project]
name = "openwhispr-whisperx-sidecar"
version = "0.1.0"
description = "OpenWhispr WhisperX Python sidecar: JSONL worker for reliable transcription and diarization."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
dependencies = [
    "whisperx==3.8.6",
    "pydantic>=2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[project.scripts]
openwhispr-whisperx-worker = "openwhispr_whisperx.worker:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openwhispr_whisperx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
